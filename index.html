<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>日程マッチ</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1f2328; --sub: #6b6f76; --line: #e3e1da;
    --ok: #1f7a55; --ok-bg: #e5f3ec; --busy: #9a9ea5; --busy-bg: #f0efeb;
    --accent: #1f7a55; --chip: #ecebe6; --note: #8a5a00; --note-bg: #fbf1dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --card: #1f2226; --ink: #e8e6e1; --sub: #9ca1a8; --line: #30343a;
      --ok: #6fd3a3; --ok-bg: #173327; --busy: #737880; --busy-bg: #25282d;
      --accent: #6fd3a3; --chip: #2a2e33; --note: #f0c36b; --note-bg: #3a2f17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 96px; }
  header h1 { font-size: 20px; margin: 4px 0 2px; }
  header p { margin: 0; color: var(--sub); font-size: 13px; }
  .filters { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 14px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .row > span.lbl { font-size: 12px; color: var(--sub); width: 56px; flex-shrink: 0; }
  .chip {
    border: 1px solid transparent; background: var(--chip); color: var(--ink);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--card); }
  label.toggle { font-size: 13px; color: var(--sub); display: flex; gap: 6px; align-items: center; }
  .summary { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 10px; font-size: 13px; color: var(--sub); }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .day h2 { font-size: 16px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
  .day h2 small { font-weight: normal; color: var(--sub); font-size: 12px; }
  .note { background: var(--note-bg); color: var(--note); font-size: 12px; border-radius: 6px; padding: 3px 8px; margin: 0 0 6px; display: inline-block; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; }
  .slot { border-radius: 8px; padding: 6px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .slot.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .slot.busy { background: var(--busy-bg); color: var(--busy); font-size: 12px; }
  .empty, .msg { text-align: center; color: var(--sub); padding: 32px 8px; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center;
  }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; background: var(--chip); color: var(--ink); }
  .btn.primary { background: var(--accent); color: var(--card); font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>日程マッチ</h1>
    <p>相手の空き時間シートと自分のGoogleカレンダーを照合しています</p>
  </header>

  <section class="filters">
    <div class="row" id="f-len"><span class="lbl">長さ</span>
      <button class="chip" data-v="60" aria-pressed="true">1時間〜</button>
      <button class="chip" data-v="120" aria-pressed="false">2時間〜</button>
      <button class="chip" data-v="180" aria-pressed="false">3時間〜</button>
    </div>
    <div class="row" id="f-time"><span class="lbl">時間帯</span>
      <button class="chip" data-v="am" aria-pressed="true">午前</button>
      <button class="chip" data-v="pm" aria-pressed="true">午後</button>
      <button class="chip" data-v="ev" aria-pressed="true">夜(18時〜)</button>
    </div>
    <div class="row" id="f-dow"><span class="lbl">曜日</span></div>
    <div class="row"><span class="lbl"></span>
      <label class="toggle"><input type="checkbox" id="f-busy"> 合わない枠と理由も表示</label>
    </div>
  </section>

  <div class="summary"><span id="count"></span><span id="updated"></span></div>
  <div id="list"><div class="msg">読み込み中…</div></div>
</div>

<div class="bar">
  <button class="btn" id="reload">更新</button>
  <button class="btn primary" id="copy">候補をコピー</button>
</div>
<div class="toast" id="toast"></div>

<script>
  // データはApps Scriptから合言葉付きで取得する。合言葉はURLの #k=… で渡し、端末に覚えさせる
  const API = 'https://script.google.com/macros/s/AKfycbyIJEx-ye4M-9UsoSiCrqn-bPks_jJGodoyobWifWpW3Bl-XvSm6XNWZMa33oajwHTnDw/exec';
  const KEY = (() => {
    const m = location.hash.match(/k=([\w-]+)/);
    try {
      if (m) localStorage.setItem('k', m[1]);
      return m ? m[1] : localStorage.getItem('k');
    } catch (e) { return m && m[1]; }
  })();
  const DOW = '日月火水木金土';
  let data = null;
  const state = { len: 60, time: new Set(['am', 'pm', 'ev']), dow: new Set([0,1,2,3,4,5,6]), busy: false };

  const dowRow = document.getElementById('f-dow');
  [1,2,3,4,5,6,0].forEach(d => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.v = d; b.textContent = DOW[d]; b.setAttribute('aria-pressed', 'true');
    dowRow.appendChild(b);
  });

  function single(rowId, key) {
    document.getElementById(rowId).addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      [...e.currentTarget.querySelectorAll('.chip')].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      state[key] = +b.dataset.v; render();
    });
  }
  function multi(rowId, key, cast) {
    document.getElementById(rowId).addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      const v = cast(b.dataset.v), on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      on ? state[key].add(v) : state[key].delete(v); render();
    });
  }
  single('f-len', 'len');
  multi('f-time', 'time', String);
  multi('f-dow', 'dow', Number);
  document.getElementById('f-busy').addEventListener('change', e => { state.busy = e.target.checked; render(); });

  const band = m => m < 12 * 60 ? 'am' : m < 18 * 60 ? 'pm' : 'ev';
  const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

  // 続いている空き枠を1つの範囲にまとめる
  function mergeOk(slots) {
    const ok = slots.filter(s => s.ok).sort((a, b) => a.startMin - b.startMin), out = [];
    ok.forEach(s => {
      const last = out[out.length - 1];
      if (last && last.endMin === s.startMin) last.endMin = s.endMin;
      else out.push({ startMin: s.startMin, endMin: s.endMin });
    });
    return out;
  }

  function filtered() {
    return data.days.filter(d => state.dow.has(d.dow)).map(d => {
      // 時間帯で切ってから長さで絞る
      const inBand = d.slots.filter(s => state.time.has(band(s.startMin)));
      const ranges = mergeOk(inBand).filter(r => r.endMin - r.startMin >= state.len);
      const busy = inBand.filter(s => !s.ok);
      return { ...d, ranges, busy };
    }).filter(d => d.ranges.length || (state.busy && d.busy.length));
  }

  function render() {
    if (!data) return;
    const days = filtered(), list = document.getElementById('list');
    const n = days.reduce((a, d) => a + d.ranges.length, 0);
    document.getElementById('count').textContent = `候補 ${n}枠 / ${days.filter(d => d.ranges.length).length}日`;
    document.getElementById('updated').textContent = `${data.updatedAt} 時点`;
    if (!days.length) { list.innerHTML = '<div class="empty">条件に合う日時がありません</div>'; return; }
    list.innerHTML = days.map(d => `
      <article class="day">
        <h2>${d.label}${d.ranges.length ? '' : ' <small>合う枠なし</small>'}</h2>
        ${d.allDay.length ? `<div class="note">終日：${esc(d.allDay.join('、'))}</div>` : ''}
        <div class="slots">
          ${d.ranges.map(r => `<span class="slot ok">${hm(r.startMin)}–${hm(r.endMin)}</span>`).join('')}
          ${state.busy ? d.busy.map(s => `<span class="slot busy">${s.start}–${s.end} ${esc(s.busy.join('・'))}</span>`).join('') : ''}
        </div>
      </article>`).join('');
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function copyText() {
    if (!data) return;
    const lines = filtered().filter(d => d.ranges.length)
      .map(d => `・${d.label} ${d.ranges.map(r => `${hm(r.startMin)}–${hm(r.endMin)}`).join('／')}`);
    const text = lines.length ? `候補日時です。\n${lines.join('\n')}` : '';
    if (!text) return toast('コピーする候補がありません');
    const done = () => toast('候補をコピーしました');
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
    t.select(); document.execCommand('copy'); t.remove(); done();
  }

  let timer;
  function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(timer); timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function load() {
    document.getElementById('list').innerHTML = '<div class="msg">読み込み中…</div>';
    const fail = msg => {
      document.getElementById('list').innerHTML =
        `<div class="msg">読み込めませんでした<br><small>${esc(msg)}</small></div>`;
    };
    if (!KEY) return fail('合言葉付きのURLから開いてください');
    fetch(`${API}?format=json&k=${encodeURIComponent(KEY)}`)
      .then(r => r.text())
      .then(txt => {
        let r;
        try { r = JSON.parse(txt); } catch (e) { throw new Error('URLの合言葉が正しくありません'); }
        data = r; render();
      })
      .catch(err => fail(err.message || String(err)));
  }
  document.getElementById('reload').addEventListener('click', load);
  document.getElementById('copy').addEventListener('click', copyText);
  load();
</script>
</body>
</html>
